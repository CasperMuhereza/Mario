<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Robot Runner</title>
    <style>
        /* Base page layout centering the canvas */
        body {
            margin: 0;
            height: 100vh;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        
        .game-container {
            position: relative;
            width: 1024px;
            height: 576px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #000;
        }

        /* Stylized instructional overlay layer */
        #instruction-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9); /* Dark slate semi-transparent backdrop */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            z-index: 10;
        }

        /* Smooth fade-out utility class triggered by JS */
        #instruction-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #instruction-overlay h1 {
            font-size: 42px;
            margin-bottom: 5px;
            color: #00BFFF;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.4);
        }

        #instruction-overlay p.subtitle {
            font-size: 16px;
            color: #94A3B8;
            margin-bottom: 30px;
        }

        /* Control Map Grid layout */
        .controls-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            width: 80%;
            max-width: 600px;
        }

        .control-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .control-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Simulated keyboard caps styling */
        .key-cap {
            display: inline-block;
            background: #f1f5f9;
            color: #1e293b;
            font-weight: bold;
            font-size: 18px;
            padding: 5px 12px;
            border-radius: 4px;
            border-bottom: 4px solid #cbd5e1;
            margin-bottom: 10px;
            min-width: 20px;
        }

        .control-card p {
            margin: 0;
            font-size: 14px;
            color: #cbd5e1;
        }

        /* Call-To-Action Start Button */
        .start-btn {
            background: #00BFFF;
            color: #fff;
            border: none;
            padding: 12px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 191, 255, 0.4);
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .start-btn:hover {
            background: #009ad4;
            transform: scale(1.03);
        }

        .start-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="instruction-overlay">
            <h1>Endless Scroller</h1>
            <p class="subtitle">Run as far as you can and gather standard currency metrics!</p>
            
            <div class="controls-wrapper">
                <div class="control-card">
                    <div class="key-cap">A</div>
                    <p>Move Left</p>
                </div>
                <div class="control-card">
                    <div class="key-cap">W</div>
                    <p>Jump Higher</p>
                </div>
                <div class="control-card">
                    <div class="key-cap">D</div>
                    <p>Move Right</p>
                </div>
            </div>

            <button class="start-btn" id="start-btn">START GAME (Spacebar)</button>
        </div>

        <canvas></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
